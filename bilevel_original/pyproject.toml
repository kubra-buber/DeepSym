[project]
name = "bilevel-planning"
version = "0.1.0"
description = "Bilevel Planning with Learned Symbolic Abstractions from Interaction Data"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "lightning>=2.0",
    "numpy",
    "pybullet",
    "pyyaml",
    "tqdm",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "blocks",
    "models",
    "dataset",
    "utils",
    "environment",
    "manipulators",
    "train",
    "evaluate",
    "eval_prediction",
    "evaluate_time",
    "evaluate_efficiency",
    "learn_rules",
    "parse",
    "explore",
    "collect_mp",
]
